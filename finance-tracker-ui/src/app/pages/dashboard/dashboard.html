<div class="dashboard-page">
  <h1>Dashboard</h1>

  @if (loading()) {
    <div class="center"><mat-spinner /></div>
  } @else {
    <div class="stats-grid">
      <mat-card class="stat-card primary">
        <mat-card-content>
          <mat-icon>account_balance_wallet</mat-icon>
          <div>
            <span>Saldo totale</span>
            <strong>{{ totalBalance() | currency:'EUR':'symbol':'1.2-2':'it' }}</strong>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card">
        <mat-card-content>
          <mat-icon>account_balance</mat-icon>
          <div>
            <span>Conti collegati</span>
            <strong>{{ accounts().length }}</strong>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    @if (accounts().length > 0) {
      <div class="charts-grid">
        <mat-card class="chart-card">
          <mat-card-header>
            <mat-card-title>Distribuzione saldo per conto</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <canvas baseChart
              [data]="chartData"
              [options]="chartOptions"
              type="doughnut">
            </canvas>
          </mat-card-content>
        </mat-card>
      </div>
    }
  }
</div>
